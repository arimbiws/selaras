services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: selaras
      POSTGRES_USER: selaras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selaras -d selaras"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
